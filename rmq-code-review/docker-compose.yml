services:
  namesrv:
    image: apache/rocketmq:5.5.0
    container_name: rmqnamesrv
    ports:
      - "9876:9876"
    networks:
      - rocketmq
    command: sh mqnamesrv

  broker:
    image: apache/rocketmq:5.5.0
    container_name: rmqbroker
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
      - "8080:8080"
      - "8081:8081"
      - "8082:8082" 
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
    volumes:
      - ./conf/broker.conf:/home/rocketmq/rocketmq-5.5.0/conf/broker.conf
    depends_on:
      - namesrv
    networks:
      - rocketmq
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.5.0/conf/broker.conf --enable-proxy

  dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: rmqdashboard
    network_mode: "service:broker" # 共享 Broker 网络，直接通过 127.0.0.1 互通
    environment:
      - JAVA_OPTS=-Drocketmq.namesrv.addr=rmqnamesrv:9876
    depends_on:
      - broker

networks:
  rocketmq:
    driver: bridge
